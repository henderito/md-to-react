name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Version Bump Format
        id: check_version
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git log origin/${{ github.base_ref }}...HEAD --format=%B > commits.txt
            echo "${{ github.event.pull_request.title }}" >> commits.txt
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              git log -1 --format=%B > commits.txt
            else
              git log ${{ github.event.before }}..${{ github.sha }} --format=%B > commits.txt
            fi
          fi
          
          if grep -iE '\[patch\]|\[minor\]|\[major\]' commits.txt; then
            echo "Version bump tag found."
          else
            echo "Error: Commit message or PR title must contain [patch], [minor], or [major]."
            exit 1
          fi

      - name: Check Changelog Modification
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          else
            git diff --name-only HEAD^1...HEAD > changed_files.txt
          fi
          
          if grep -i 'changelog.md' changed_files.txt; then
            echo "changelog.md was modified."
          else
            echo "Error: changelog.md must be modified."
            echo "Changed files:"
            cat changed_files.txt
            exit 1
          fi

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test
        
      - name: Build Package
        run: npm run build
        
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Extract Bump Type and Publish
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            MSG=$(git log -1 --format=%B)
          else
            MSG=$(git log ${{ github.event.before }}..${{ github.sha }} --format=%B)
          fi
          
          if echo "$MSG" | grep -i '\[major\]'; then
            BUMP="major"
          elif echo "$MSG" | grep -i '\[minor\]'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          
          echo "Bumping version ($BUMP)..."
          npm version $BUMP -m "chore(release): %s [skip ci]"
          git push origin HEAD --tags
          
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
